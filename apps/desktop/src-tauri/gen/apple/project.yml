name: jargonslayer
options:
  bundleIdPrefix: com.bioinfospace.jargonslayer
  deploymentTarget:
    iOS: 26.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: JargonSlayer
      PRODUCT_BUNDLE_IDENTIFIER: com.bioinfospace.jargonslayer
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  jargonslayer_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: jargonslayer_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: jargonslayer_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        # iOS-cloud fix round (Opus F1, HIGH): iPhone is PORTRAIT-ONLY
        # for now — the full-bleed shell (viewport-fit=cover + native
        # .never) compensates top/bottom insets only; nothing in
        # apps/web handles env(safe-area-inset-left/right), so in
        # landscape the ☰ button (the ONLY route to 设置/帮助 on iOS)
        # lands in the sensor-housing band. Re-adding landscape is a
        # designed-feature decision (horizontal inset support across
        # every fixed frame), not a one-liner — do both together.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # S13.1 + TestFlight round correction (2026-07-25): the version the
        # BUILT app actually carries comes from tauri.conf.json's top-level
        # "version" — `tauri ios build` REWRITES the generated Info.plist
        # from it every build (no tauri.conf version = 1.0.0 default, which
        # is exactly how the app shipped mis-stamped despite this file
        # saying 0.6.0; empirically traced). This entry is now just the
        # regen template's copy. Release-train bump = Cargo.toml [package]
        # + tauri.conf.json "version" + here, and check-ios-plist.mjs
        # fails the build if the generated plist drifts from Cargo.toml.
        CFBundleShortVersionString: 0.7.5
        CFBundleVersion: "0.7.5"
        # TestFlight export compliance, declared once (ASC would otherwise
        # ask per-build): the app uses ONLY standard HTTPS/system TLS —
        # exempt encryption, so false is the honest value. With this key
        # present, uploaded builds skip the 出口合规 questionnaire.
        ITSAppUsesNonExemptEncryption: false
        # S13 review fix S4 (Sol HIGH, XcodeGen-reproduced): project.yml OWNS
        # jargonslayer_iOS/Info.plist — keys absent here are DELETED on any
        # XcodeGen regen. Missing NSMicrophoneUsageDescription = hard
        # process-kill at first mic access. Keep in sync with
        # ../../Info.ios.plist (config-dir source of truth) and the
        # scripts/check-ios-plist.mjs pre-build guard (covers full
        # `tauri ios init` re-runs, which regenerate THIS file too).
        NSMicrophoneUsageDescription: JargonSlayer 需要麦克风来实时识别会议语音
        NSSpeechRecognitionUsageDescription: JargonSlayer 使用设备端语音识别把会议内容转写为文字
    entitlements:
      path: jargonslayer_iOS/jargonslayer_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        # TestFlight round: distribution signing needs an explicit team
        # (sim builds never did, which is why this was missing until the
        # first --export-method app-store-connect run failed). NOTE the
        # build does NOT re-run XcodeGen — the live copy of these two
        # values sits in jargonslayer.xcodeproj/project.pbxproj (both
        # debug+release blocks); keep the pair in sync.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: RFJQL954S9
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a