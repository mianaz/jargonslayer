# CI v1 (2026-07-28): the exact gates every release train runs by hand —
# root vitest + tsc on Linux, cargo/clippy/swift on macOS. Deliberately
# excluded: any bundling/signing (DMG/IPA stay local until the
# Apple-creds-in-CI decision, ROADMAP D5).
#
# v0.7.5: the sidecar Python asserts now run here too. The original
# exclusion assumed they needed the provisioned venv; they do not — every
# sidecar/test_*.py stubs its own heavy imports and runs green on a bare
# interpreter, so ~7,100 lines of tests that executed nowhere now gate
# every push. See scripts/test-sidecar.mjs for why requirements-sidecar
# is deliberately not installed.
#
# v0.7.9 test-coverage pass: the iOS plugin's Swift tests (tauri-plugin-
# os-speech/ios/Tests, 43 as of this wiring) now run here too, via
# scripts/test-ios-core.mjs — no SwiftPM restructure after all: the
# runner stages the Tauri-free OsSpeechCore target + its tests into a
# scratch manifest, sidestepping both host blockers (the glue target's
# Tauri/UIKit dependency AND the gitignored ../.tauri path dep that
# fails resolution on a fresh checkout). The plugin's Rust half gets its
# own `cargo test --manifest-path` step for the same reason: an
# iOS-target-only dependency, it was never compiled by the app crate's
# `cargo test` at all.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: vitest + typecheck (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same suite as plain `npm test`, plus v8 coverage with the floors
      # set in vitest.config.ts's coverage.thresholds — before this,
      # nothing measured coverage anywhere, so a 300-line zero-coverage
      # module could land under a green run. include-all denominators:
      # never-imported files count against the floor too.
      - run: npm run test:coverage
      - run: npm run typecheck
      - run: npm run check:versions
      # numpy/websockets/tqdm only — NOT requirements-sidecar.txt. See
      # sidecar/requirements-test.txt for how that set was derived and
      # why the heavy backends stay out.
      - run: pip install -r sidecar/requirements-test.txt
      - run: npm run test:sidecar

  native:
    name: cargo + clippy + swift (macos)
    # macos-26: the audiocap helper compiles against the macOS 26
    # SpeechAnalyzer SDK surface (SpeechTranscriber/AssetInventory) —
    # older runner images fail at build-audiocap with missing symbols.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # cargo compiles tauri::generate_context!, which needs frontendDist
      # (apps/web/out) present and the externalBin binaries on disk — npm ci
      # runs the ffmpeg-assets postinstall; fetch-uv and build-audiocap
      # produce the two sidecars the bundle config names.
      - run: npm ci
      - run: node scripts/fetch-uv.mjs
      - run: node scripts/build-audiocap.mjs
      - run: mkdir -p apps/web/out
      # Pinned to a specific stable version, not the moving `stable`
      # channel alias: this job runs `clippy -D warnings`, so a routine
      # upstream stable-toolchain bump landing a new lint would break CI
      # on its own with no code change to blame. Matches the toolchain
      # actually installed on dev machines (`rustc --version` under
      # apps/desktop/src-tauri) — bump both together, deliberately, when
      # upgrading.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.97.1"
          # A pinned toolchain installs fresh WITHOUT clippy (the runner's
          # preinstalled stable had it — first pinned run failed on this).
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            apps/desktop/src-tauri/tauri-plugin-os-speech
      - run: cargo test
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      # tauri-plugin-os-speech is an iOS-target-only dependency of the app
      # crate with no cargo workspace binding them, so the `cargo test`
      # above never even COMPILES it — until this step the plugin's Rust
      # half had no tests, no type-check, and no lints running anywhere.
      # Its desktop.rs stub exists precisely so a host build type-checks
      # the shared code; this runs its own suite (models.rs's Rust<->Swift
      # wire-contract tests, the counterpart of OsSpeechWireTests.swift).
      - run: cargo test --manifest-path tauri-plugin-os-speech/Cargo.toml
        working-directory: apps/desktop/src-tauri
      - run: swift test --package-path apps/desktop/src-tauri/audiocap-helper
      # The iOS plugin's 43 Tauri-free core tests (ios/Tests/
      # OsSpeechCoreTests) — the gap the header comment above used to
      # carve out. A bare `swift test` in that package still can't work on
      # a host (the glue target needs Tauri, whose package imports UIKit
      # unconditionally, and the ../.tauri path dependency only exists
      # after a tauri ios build); the runner stages OsSpeechCore + its
      # tests into a scratch Tauri-free manifest instead — automating
      # ios/Package.swift's own documented manual workaround.
      - run: node scripts/test-ios-core.mjs
