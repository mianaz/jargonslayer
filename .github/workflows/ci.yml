# CI v1 (2026-07-28): the exact gates every release train runs by hand —
# root vitest + tsc on Linux, cargo/clippy/swift on macOS. Deliberately
# excluded: any bundling/signing (DMG/IPA stay local until the
# Apple-creds-in-CI decision, ROADMAP D5).
#
# v0.7.5: the sidecar Python asserts now run here too. The original
# exclusion assumed they needed the provisioned venv; they do not — every
# sidecar/test_*.py stubs its own heavy imports and runs green on a bare
# interpreter, so ~7,100 lines of tests that executed nowhere now gate
# every push. See scripts/test-sidecar.mjs for why requirements-sidecar
# is deliberately not installed.
#
# Still NOT covered, so nobody mistakes this for total: the iOS plugin's
# 43 Swift tests under tauri-plugin-os-speech/ios/Tests — they need a
# SwiftPM restructure first, because a bare `swift test` there also
# builds the Tauri-dependent glue target, which cannot compile on macOS
# (that package's Package.swift documents the manual workaround).
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: vitest + typecheck (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:versions
      # No pip install: these run on a bare interpreter by design.
      - run: npm run test:sidecar

  native:
    name: cargo + clippy + swift (macos)
    # macos-26: the audiocap helper compiles against the macOS 26
    # SpeechAnalyzer SDK surface (SpeechTranscriber/AssetInventory) —
    # older runner images fail at build-audiocap with missing symbols.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # cargo compiles tauri::generate_context!, which needs frontendDist
      # (apps/web/out) present and the externalBin binaries on disk — npm ci
      # runs the ffmpeg-assets postinstall; fetch-uv and build-audiocap
      # produce the two sidecars the bundle config names.
      - run: npm ci
      - run: node scripts/fetch-uv.mjs
      - run: node scripts/build-audiocap.mjs
      - run: mkdir -p apps/web/out
      # Pinned to a specific stable version, not the moving `stable`
      # channel alias: this job runs `clippy -D warnings`, so a routine
      # upstream stable-toolchain bump landing a new lint would break CI
      # on its own with no code change to blame. Matches the toolchain
      # actually installed on dev machines (`rustc --version` under
      # apps/desktop/src-tauri) — bump both together, deliberately, when
      # upgrading.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.97.1"
          # A pinned toolchain installs fresh WITHOUT clippy (the runner's
          # preinstalled stable had it — first pinned run failed on this).
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo test
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - run: swift test --package-path apps/desktop/src-tauri/audiocap-helper
